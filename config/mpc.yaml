mpc_controller:
  ros__parameters:
    use_sim_time: true
    horizon: 20          # N
    dt: 0.1              # [s] control period == prediction step
    v_ref: 0.35
    v_max: 0.5
    v_min: -0.1
    w_max: 1.5
    a_max: 1.0
    alpha_max: 3.0
    Q:  [10.0, 10.0, 1.0]   # x, y, theta tracking
    R:  [0.5, 0.1]          # deviation from feed-forward v, w
    Rd: [1.0, 0.5]          # smoothness (delta u)
    P:  [20.0, 20.0, 2.0]   # terminal
    path: figure_eight      # figure_eight | sharp_corners

pure_pursuit:
  ros__parameters:
    use_sim_time: true
    lookahead: 0.4
    v_ref: 0.35
    w_max: 1.5
    path: figure_eight

metrics_logger:
  ros__parameters:
    use_sim_time: true
    path: figure_eight
